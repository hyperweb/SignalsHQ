<style>

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){

  --accent:#7aa2ff; --accent-soft:#1c2a4a; --accent-fg:#0b1220;
  --signal:#f0a640; --signal-soft:#3a2a10;
  --good:#6fd08a; --good-soft:#153222; --warn:#e3b54d; --warn-soft:#3a2f12; --bad:#f08a78; --bad-soft:#3d1c16;
  --shadow:0 14px 44px rgba(0,0,0,.55); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f141c; --surface:#161d28; --sunk:#1e2735; --line:#2c3746; --fg:#e3e9f2; --muted:#93a0b4;
  --accent:#7aa2ff; --accent-soft:#1c2a4a; --accent-fg:#0b1220;
  --signal:#f0a640; --signal-soft:#3a2a10;
  --good:#6fd08a; --good-soft:#153222; --warn:#e3b54d; --warn-soft:#3a2f12; --bad:#f08a78; --bad-soft:#3d1c16;
  --shadow:0 14px 44px rgba(0,0,0,.55); color-scheme:dark}
*{box-sizing:border-box}

/* ---------- audience tags, filter chips, last sweep ---------- */
const liveAuds=()=>Object.values(auds).filter(a=>!a.removed).sort((a,b)=>String(a.name).localeCompare(b.name));
const multiAud=()=>Object.keys(auds).length>1;
function audHue(id){const ids=Object.keys(auds).sort();const i=ids.indexOf(id);return i<0?210:(i*67+200)%360;}
function audTag(id){if(!id||!auds[id])return `<span class="atag" style="--h:220">No audience</span>`;return `<span class="atag" style="--h:${audHue(id)}" title="Audience (ICP)">${esc(auds[id].name)}${auds[id].removed?" (removed)":""}</span>`;}
function audChips(count){
  if(!multiAud())return "";
  const list=liveAuds(); if(audF&&auds[audF]&&!list.some(a=>a._id===audF))list.push(auds[audF]);
  return `<div class="strip" role="group" aria-label="Filter by audience"><button class="chip" type="button" data-af="" aria-pressed="${!audF}">All audiences <b>${count("")}</b></button>${list.map(a=>`<button class="chip" type="button" data-af="${esc(a._id)}" aria-pressed="${audF===a._id}">${audTag(a._id)} <b>${count(a._id)}</b></button>`).join("")}</div>`;
}
function wireAudChips(m){m.querySelectorAll("[data-af]").forEach(b=>b.onclick=()=>{audF=b.dataset.af;remember();drawHead();draw();});}
const ts=x=>{const t=Date.parse(x||"");return isNaN(t)?0:t;};
function lastRun(audId){return runs.filter(r=>(r.by||"").includes("sweep")&&(r.audienceId||"")===audId&&(r.sources||[]).length!==0).sort((a,b)=>ts(b.at)-ts(a.at))[0];}
function isNewSig(s){const r=lastRun(s.audienceId||"");if(!r)return false;const f=ts(s.foundAt),a=ts(r.at);return f&&f>=a-4*36e5&&f<=a+36e5;}
const dTime=x=>{const d=new Date(x);return isNaN(d)?"":d.toLocaleString("en-CA",{timeZone:"America/Toronto",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});};
function lastSweepLine(){
  const ids=audF?[audF]:liveAuds().map(a=>a._id);
  const parts=ids.map(id=>{const r=lastRun(id);if(!r)return multiAud()?`<span>${audTag(id)} no sweep yet</span>`:"";const nNew=sigs.filter(x=>x.audienceId===id&&isNewSig(x)&&(x.status||"New")==="New"&&x.triage!=="Dismiss").length;
    return `<span>${multiAud()?audTag(id)+" ":""}last sweep <b>${esc(dTime(r.at))}</b>: found ${+r.found||0}, kept ${+r.kept||0}${nNew?`, <b>${nNew} still waiting</b>`:""}</span>`;}).filter(Boolean);
  return parts.length?`<p class="lastsweep">${parts.join("")}</p>`:"";
}

/* ---------- market moments: reasons to contact a whole segment, not single leads ---------- */
function momentsLane(){
  const list=moments.filter(m=>(m.status||"New")==="New"&&!(isClientView()&&m.hqOnly)).sort((a,b)=>String(b.date||b.foundAt).localeCompare(String(a.date||a.foundAt))).slice(0,6);
  if(!list.length)return "";

  <p class="help" style="margin:0;font-size:13px;color:var(--muted)">Not leads. Each one is a reason to reach a whole segment you already know, such as a storm warning for your property managers.</p>
  ${list.map(m=>`<div class="moment" data-mid="${esc(m._id)}"><div><b>${esc(m.title)}</b>${!isClientView()&&m.hqOnly?' <span class="heldtag">Hyperweb only, testing</span>':""}<p>${esc([m.area,dShort(m.date),m.sourceName].filter(Boolean).join(" · "))}${safeUrl(m.url)?` · <a href="${esc(m.url)}" target="_blank" rel="noopener">Details</a>`:""}</p>${m.detail?`<p>${esc(String(m.detail).slice(0,260))}</p>`:""}</div>

}
function wireMoments(m){m.querySelectorAll("[data-mid]").forEach(row=>{const id=row.dataset.mid,set=st=>db.collection("moments").doc(id).update({status:st,decidedAt:nowIso(),decidedBy:"Desk"}).catch(()=>{});
  const u=row.querySelector("[data-mused]"),d=row.querySelector("[data-mdis]");if(u)u.onclick=()=>set("Used");if(d)d.onclick=()=>set("Dismissed");});}

/* ---------- Signals inbox ---------- */
function drawInbox(){
  const m=$("main"), base=sigs.filter(inAud).filter(s=>!(isClientView()&&s.hqOnly));

  ${momentsLane()}
  ${pend.length?`<p class="note">A sweep is ${pend.some(r=>r.status==="Running")?"running now":"queued"}${pend[0].audienceId?" for "+esc(audName(pend[0].audienceId)):""}. New signals appear here as Claude finds them.</p>`:""}
  <div class="howto"><p>Every week the desk looks for companies that fit your audiences and have a reason to buy right now, checks each one, and sorts it into one of three piles:</p>

  <label class="meta">Sort <select class="sel" id="sigSort">${[["best","Best fit first"],["found","Newest found"],["date","Newest signal date"],["aud","By audience"]].map(([k,l])=>`<option value="${k}" ${sigSort===k?"selected":""}>${l}</option>`).join("")}</select></label></div>
  ${list.length?`<div class="grid">${list.map(sigCard).join("")}</div>`:`<div class="empty"><h2>${base.length?"Nothing in this view":"No signals yet"}</h2><p>${base.length?"Try another filter.":Object.keys(auds).length?"The first sweep fills this inbox. Use Run a sweep now, or wait for "+esc(ws.sweepDay||"Monday")+" morning.":"Set up an audience first, then run a sweep."}</p></div>`}`;
  wireAudChips(m); wireMoments(m); $("sigSort").onchange=e=>{sigSort=e.target.value;drawInbox();};
  m.querySelectorAll("[data-sf]").forEach(b=>b.onclick=()=>{sigF=b.dataset.sf;drawInbox();});
  m.querySelectorAll("article[data-sid]").forEach(wireSig);
  const ga=$("gDisAll"); if(ga)ga.onclick=async()=>{ga.disabled=true;const gt=$("gT");let n=0;
    for(const s of flagged){try{await db.collection("signals").doc(s._id).update({status:"Dismissed",dismissReason:guardFlag(s).reason,decidedAt:nowIso(),decidedBy:"Desk"});n++;}catch(e){gt.textContent=saveErr(e);break;}}

}

    ${gf?`<p class="err ctl" style="justify-content:space-between"><span><b>Don't prospect.</b> ${esc(gf.why)}</span><button class="btn sm" type="button" data-gdis ${canWrite?"":"disabled"}>Dismiss: ${esc(gf.reason)}</button></p>`:""}
    <header><div><h3>${esc(s.company)}</h3><span class="dom">${safeUrl("https://"+cleanDomain(s.domain))&&s.domain?`<a href="https://${esc(cleanDomain(s.domain))}" target="_blank" rel="noopener">${esc(cleanDomain(s.domain))}</a> · `:""}${esc([s.city,s.industry].filter(Boolean).join(" · "))}</span></div>
    <div class="ctl" style="flex-wrap:nowrap"><span class="pill t-${esc(s.triage||"Review")}">${esc(s.triage||"Review")}</span>${sc!=null?`<span class="score" title="Fit score from need, ability to pay and timing">${meter(sc)}${sc}</span>`:""}</div></header>

    ${isCB(s)?`<div class="ctl"><span class="cbtag" title="Found through Crunchbase. Shown as derived insight, not a copied record.">Crunchbase</span>${a?.crunchbase?.growthHighOnly!==false&&growthHigh(s.growth)?`<span class="pill p-good" title="${esc(s.growth.label||"")}">Higher-confidence growth outlook</span>`:""}</div>`:""}
    ${[s.size&&"Staff "+s.size,s.founded&&"Since "+s.founded,s.revenue&&"Revenue "+s.revenue].filter(Boolean).length?`<p class="firmo">${esc([s.size&&"Staff "+s.size,s.founded&&"Since "+s.founded,s.revenue&&"Revenue "+s.revenue].filter(Boolean).join(" · "))}</p>`:""}
    ${s.triageNote?`<p class="why ${s.triage==="Dismiss"?"dis":""}">${esc(s.triageNote)}</p>`:""}

    ${(s.teasers||[]).length||s.insight?`<details class="more"><summary>Conversation starters</summary><div class="teasers">${s.insight?`<div class="tz"><span class="k">Give first</span>${esc(s.insight)}</div>`:""}${(s.teasers||[]).map(t=>`<div class="tz"><span class="k">${esc(KIND[t.kind]||t.kind)}</span>${esc(t.hook)}<small>${t.source?(safeUrl(t.url)?`<a href="${esc(t.url)}" target="_blank" rel="noopener">${esc(t.source)}</a>`:esc(t.source)):""}</small></div>`).join("")}</div></details>`:""}
    <div class="ctl">${s.sourceName?`<span class="srctag" title="Signal source${s.sourceCode?" · "+esc(s.sourceCode):""}">${esc(s.sourceName)}</span>`:""}${s.project?'<span class="srctag" title="A site or application. Work out who the buyer is before reaching out.">Project</span>':""}${!isClientView()&&s.hqOnly?'<span class="heldtag" title="This source is being tested. Only the Hyperweb team sees it until it goes live.">Hyperweb only, testing</span>':""}${multiAud()?audTag(s.audienceId):""}${isNewSig(s)?'<span class="newtag">From the last sweep</span>':""}${s.foundAt?`<span class="firmo">Found ${esc(dShort(s.foundAt))}</span>`:""}</div>

    <div class="acts">${st==="New"?`<button class="btn primary sm" type="button" data-acc ${canWrite?"":"disabled"}>Accept as lead</button><label class="toast"><input type="checkbox" data-enrich ${ws.enrichOnAccept?"checked":""}> Find contacts</label><select class="sel" data-dr aria-label="Reason to dismiss">${DISMISS.map(r=>`<option ${r===(gf?.reason||s.suggestedReason)?"selected":""}>${r}</option>`).join("")}</select><button class="btn sm" type="button" data-dis ${canWrite?"":"disabled"}>Dismiss</button>`

function wireSig(art){
  const s=sigs.find(x=>x._id===art.dataset.sid), t=art.querySelector("[data-t]");
  const acc=art.querySelector("[data-acc]");
  if(acc)acc.onclick=async()=>{acc.disabled=true;t.textContent="Adding…";try{await acceptSignal(s,art.querySelector("[data-enrich]")?.checked);t.textContent="";}catch(e){acc.disabled=false;t.textContent=saveErr(e);}};
  const dis=art.querySelector("[data-dis]");
  if(dis)dis.onclick=async()=>{try{await db.collection("signals").doc(s._id).update({status:"Dismissed",dismissReason:art.querySelector("[data-dr]").value,decidedAt:nowIso(),decidedBy:"Desk"});}catch(e){t.textContent=saveErr(e);}};
  const gd=art.querySelector("[data-gdis]");
  if(gd)gd.onclick=async()=>{gd.disabled=true;try{await db.collection("signals").doc(s._id).update({status:"Dismissed",dismissReason:guardFlag(s)?.reason||"Other",decidedAt:nowIso(),decidedBy:"Desk"});}catch(e){gd.disabled=false;t.textContent=saveErr(e);}};
  const res=art.querySelector("[data-res]");
  if(res)res.onclick=async()=>{try{await db.collection("signals").doc(s._id).update({status:"New",decidedAt:"",dismissReason:""});}catch(e){t.textContent=saveErr(e);}};
  const op=art.querySelector("[data-open]"); if(op)op.onclick=()=>openLead(s.leadId||s._id);
  art.querySelectorAll("[data-pin]").forEach(b=>b.onclick=async()=>{const want=b.dataset.pin==="show";const v=s.teasePin===want?null:want;
    try{await db.collection("signals").doc(s._id).update({teasePin:v});}catch(e){t.textContent=saveErr(e);}});
}
async function acceptSignal(s,enrich){
  const id=s._id;
  if(!leads[id]){
    await db.collection("leads").doc(id).set({company:s.company,domain:cleanDomain(s.domain),city:s.city||"",industry:s.industry||"",size:s.size||"",audienceId:s.audienceId||"",signalId:id,sourceId:s.sourceId||"",sourceCode:s.sourceCode||"",utm:s.sourceCode?{utm_source:"signals",utm_medium:"outreach",utm_campaign:s.sourceCode}:null,
      signals:[{type:s.type||"",detail:s.detail||"",date:s.date||"",source:s.source||"",url:s.url||"",via:s.sourceTool||s.via||""}],whyNow:s.triageNote||s.detail||"",prelim:s.prelim||null,climateAdj:s.climateAdj??0,
      teasers:s.teasers||[],insight:s.insight||"",warmPath:s.warmPath||"",firstContact:s.firstContact||"",contacts:[],scripts:{},stage:"New",history:[{s:"New",at:nowIso()}],
      delivery:{status:ws.ghlLocationId?"Queued":"Not set up",target:ws.ghlLocationId?"Go High Level":""},acceptedAt:nowIso(),updatedAt:nowIso()});
  }
  await db.collection("signals").doc(id).update({status:"Accepted",leadId:id,decidedAt:nowIso(),decidedBy:"Desk"});
  if(enrich)await queueReq({kind:"enrich",leadId:id,note:ENRICH_NOTE});
  else if(ws.ghlLocationId)await queueReq({kind:"deliver",leadId:id},true);
}
async function queueReq(r,quiet){
  const id="r"+Date.now()+Math.random().toString(36).slice(2,6);
  await db.collection("requests").doc(id).set({...r,status:"Queued",requestedAt:nowIso(),fired:false});
  if(!quiet)fireRunner(id,r.kind);
  return id;
}
let mcpP=null; const getMcp=()=>mcpP||(mcpP=Promise.resolve(window.claude?.use?.("mcp")).catch(()=>null));
async function fireRunner(rid,kind){
  if(!ws.runnerId)return;
  try{const mcp=await getMcp(); if(!mcp)return;
    await mcp.callTool(CCR,"fire_trigger",{trigger_id:ws.runnerId,text:`Request from the ${ws.name||"Signals"} desk: process requests/${rid} (${kind}) on ${ws.deskUrl||"this desk"} first.`},{cache:false});
    try{await db.collection("requests").doc(rid).update({fired:true});}catch(e){}
  }catch(e){/* runner picks it up on its next hourly pass */}
}

/* ---------- Leads ---------- */

  const list=all.filter(l=>leadF==="all"||(leadF==="due"?open(l)&&isDue(l):leadF==="open"?open(l):l.stage===leadF)).sort(LS[leadSort]||byAcc);
  const d=all.filter(l=>l.delivery?.status==="Delivered").length;
  m.innerHTML=`<div class="tiles">
    <div class="tile"><span>Open leads</span><b>${all.filter(open).length}</b><small>Accepted, not closed</small></div>
    <div class="tile"><span>Delivered</span><b>${d}</b><small>${ws.ghlLocationId?"Into Go High Level":"No CRM set up"}</small></div>
    <div class="tile"><span>Engaged</span><b>${all.filter(l=>["Engaged","Meeting","Won"].includes(l.stage)).length}</b><small>Replied, accepted or met</small></div>
    <div class="tile"><span>Won</span><b>${all.filter(l=>l.stage==="Won").length}</b><small>New clients</small></div></div>

  return `<section class="sect" id="pForm"><header><div><h2>Team and playbooks</h2><p>Who works this desk, how each person works, and which plays are on. If an assistant works LinkedIn from someone else's account, set Sends as, so the desk knows whose connection it is. Each role starts on its own play, and anyone can switch a lead to another play at any time.</p></div></header>
   <div class="teamrows">${tm.map((t,i)=>`<div class="teamrow" data-ti="${i}"><input data-tn value="${esc(t.name)}" placeholder="Name" aria-label="Name"><select class="sel" data-tr aria-label="Role">${ROLES.map(r=>`<option value="${r[0]}" ${t.role===r[0]?"selected":""}>${esc(r[1])}</option>`).join("")}</select><select class="sel" data-tp aria-label="Default play"><option value="">Role default</option>${allPlays().map(p=>`<option value="${esc(p.id)}" ${t.play===p.id?"selected":""}>${esc(p.name)}</option>`).join("")}</select><select class="sel" data-tli aria-label="LinkedIn sent from"><option value="">Own LinkedIn</option>${tm.filter((x,j)=>j!==i&&x.name).map(x=>`<option value="${esc(x.name)}" ${t.liAs===x.name?"selected":""}>Sends as ${esc(x.name)}</option>`).join("")}</select><button class="btn sm ghost" type="button" data-trm>Remove</button></div>`).join("")||`<p class="muted" style="margin:0">No one added yet.</p>`}</div>
   <div class="ctl"><button class="btn sm" type="button" id="tAdd" ${canWrite?"":"disabled"}>Add a person</button></div>
   <div class="playlist">${allPlays().map(p=>`<details class="playcard"><summary><label class="ctl" style="gap:6px"><input type="checkbox" data-pon="${esc(p.id)}" ${off.has(p.id)?"":"checked"} ${canWrite?"":"disabled"}> <b>${esc(p.name)}</b></label><span class="meta">${p.role?esc((ROLES.find(r=>r[0]===p.role)||[])[1]||"")+" · ":""}${p.steps.length} steps over ${p.steps[p.steps.length-1].day} days</span></summary><p class="meta" style="margin:6px 0">${esc(p.about||"")}</p><ol class="playsteps">${p.steps.map(s=>`<li><span class="ch ch-${esc(s.ch)}">${esc(CHN[s.ch])}</span> Day ${s.day}: ${esc(s.title)}</li>`).join("")}</ol></details>`).join("")}</div>
   <p class="meta" style="margin:0">Hyperweb tunes the steps for each desk's industry and buyer. Ask your account manager for changes.</p>
   <div class="ctl"><button class="btn primary sm" type="button" id="pSave" ${canWrite?"":"disabled"}>Save team and plays</button><span class="toast" id="pT"></span></div></section>`;
}
function readTeam(){return [...document.querySelectorAll("#pForm .teamrow")].map(r=>({name:r.querySelector("[data-tn]").value.trim(),role:r.querySelector("[data-tr]").value,play:r.querySelector("[data-tp]").value,liAs:r.querySelector("[data-tli]")?.value||""}));}
function wireTeam(){
  const sec=$("pForm"); if(!sec)return;
  $("tAdd").onclick=()=>{teamDraft=[...readTeam(),{name:"",role:"nurturer",play:""}];redrawSetupTeam();};
  sec.querySelectorAll("[data-trm]").forEach(b=>b.onclick=()=>{const i=+b.closest(".teamrow").dataset.ti;const t=readTeam();t.splice(i,1);teamDraft=t;redrawSetupTeam();});
  $("pSave").onclick=async()=>{const t=readTeam().filter(x=>x.name), off=[...sec.querySelectorAll("[data-pon]")].filter(x=>!x.checked).map(x=>x.dataset.pon);
    if(off.length>=allPlays().length){$("pT").textContent="Keep at least one play on.";return;}
    try{if(loaded.wsExists)await db.collection("workspace").doc("profile").update({team:t,playsOff:off,updatedAt:nowIso()});else await db.collection("workspace").doc("profile").set({team:t,playsOff:off,createdAt:nowIso()});teamDraft=null;$("pT").textContent="Saved";}catch(e){$("pT").textContent=saveErr(e);}};
}
function redrawSetupTeam(){const sec=$("pForm");if(!sec)return;sec.outerHTML=teamSection();wireTeam();}

/* ---------- Working as ---------- */
function drawMe(){
  const sel=$("meSel"); if(!sel)return; const n=meName(), tm=team();
  sel.innerHTML=`<option value="">Pick your name</option>${tm.map(t=>`<option ${t.name===n?"selected":""}>${esc(t.name)}</option>`).join("")}${n&&!tm.some(t=>t.name===n)?`<option selected>${esc(n)}</option>`:""}<option value="__add">Not listed, add me in Setup</option>`;
}

/* ---------- Audiences ---------- */
function drawAudiences(){
  const nRm=Object.values(auds).filter(x=>x.removed).length;
  const m=$("main"), list=Object.values(auds).filter(x=>showRmAud||!x.removed||x._id===curAud).sort((a,b)=>(!!a.removed)-(!!b.removed)||String(a.name).localeCompare(b.name));
  if(curAud&&!auds[curAud])curAud=null;
  if(!curAud&&list.length){const live=list.filter(x=>!x.removed);curAud=(audF&&auds[audF]&&!auds[audF].removed)?audF:(live[0]||list[0])._id;}
  const a=audDraft||(curAud&&auds[curAud])||null;
  m.innerHTML=`<section class="sect"><header><div><h2>Audiences</h2><p>Each audience is one ideal customer profile: who they are, where they are, and which buying signals count. Every sweep runs once per active audience.</p></div><div class="ctl">${nRm?`<button class="btn sm" type="button" id="aShowRm" aria-pressed="${showRmAud}">${showRmAud?"Hide removed":"Show removed"} (${nRm})</button>`:""}<button class="btn" type="button" id="aNew" ${canWrite?"":"disabled"}>New audience</button></div></header>
   ${list.length||audDraft?`<div class="audlist">${list.map(x=>`<button class="audbtn" type="button" data-aid="${esc(x._id)}" aria-pressed="${!audDraft&&x._id===curAud}"><b>${esc(x.name)}</b><small>${x.removed?"Removed":x.active===false?"Paused":"Active"} · ${sigs.filter(s=>s.audienceId===x._id).length} signals · ${Object.values(leads).filter(l=>l.audienceId===x._id).length} leads</small></button>`).join("")}${audDraft?`<button class="audbtn" type="button" aria-pressed="true"><b>${esc(audDraft.name||"New audience")}</b><small>Not saved yet</small></button>`:""}</div>`:`<p class="muted">No audiences yet. Start one with New audience, or describe the customer and let Claude draft it.</p>`}
  </section>
  ${a?audForm(a):""}`;
  m.querySelectorAll("[data-aid]").forEach(b=>b.onclick=()=>{curAud=b.dataset.aid;audDraft=null;audRmAsk=null;drawAudiences();});
  const sr=$("aShowRm"); if(sr)sr.onclick=()=>{showRmAud=!showRmAud;drawAudiences();};
  $("aNew").onclick=()=>{audRmAsk=null;audDraft={name:"",active:true,sizes:["11 - 50","51 - 200"],geo:{radius:25},signalTypes:SIGNAL_LIB.slice(0,4).map(([type,why])=>({type,why,on:true})),sources:{news:true,jobs:true,funding:true},weights:{need:35,ability:40,timing:25},climateAdj:0};drawAudiences();};
  if(a)wireAudForm(a);
}
function audForm(a){
  const g=a.geo||{}, src=a.sources||{}, w=a.weights||{need:35,ability:40,timing:25};
  const types=[...(a.signalTypes||[])]; SIGNAL_LIB.forEach(([t,why])=>{if(!types.some(x=>x.type===t))types.push({type:t,why,on:false});});
  return `<section class="sect"><header><div><h2>${esc(a.name||"New audience")}</h2><p>Changes apply from the next sweep.</p></div>
  <div class="ctl"><button class="btn" type="button" id="aDraftBtn" ${canWrite?"":"disabled"}>Draft with Claude</button>${audDraft?"":a.removed?`<button class="btn" type="button" id="aRestore" ${canWrite?"":"disabled"}>Restore audience</button>`:`<button class="btn" type="button" id="aRmBtn" ${canWrite?"":"disabled"}>Remove audience</button>`}</div></header>
  ${!audDraft&&audRmAsk===a._id?audRmPanel(a):""}${a.removed?`<p class="muted" style="margin:0">This audience was removed${a.removedAt?" on "+esc(dShort(a.removedAt)):""}. It isn't swept, and its signals and leads stay on the desk. Restore it to edit or use it again.</p>`:""}
  <div id="aDraftBox" hidden class="f"><label class="full">Describe the customer in a few sentences<textarea id="aDesc" placeholder="e.g. Family-owned HVAC and plumbing contractors in Halton and Hamilton with 10 to 50 staff, doing commercial service work, who are hiring or opening a second location."></textarea></label><div class="ctl full"><button class="btn primary sm" type="button" id="aDraftGo">Draft it</button><span class="toast" id="aDT"></span></div></div>
  <form class="f" id="aForm">
   <label>Name<input id="a_name" required value="${esc(a.name)}" placeholder="e.g. Halton contractors, 10 to 50 staff"></label>
   <label>Status<select id="a_active"><option value="1" ${a.active!==false?"selected":""}>Active, swept every week</option><option value="0" ${a.active===false?"selected":""}>Paused</option></select></label>
   <label class="full">Ideal customer, one sentence<input id="a_headline" value="${esc(a.headline)}"></label>
   <label>Who fits <small>one per line</small><textarea id="a_who">${esc((a.who||[]).join("\n"))}</textarea></label>
   <label>Not a fit <small>one per line</small><textarea id="a_notFit">${esc((a.notFit||[]).join("\n"))}</textarea></label>
   <label>Industries <small>one per line</small><textarea id="a_industries">${esc((a.industries||[]).join("\n"))}</textarea></label>
   <label>First person to contact <small>roles, one per line</small><textarea id="a_titles">${esc((a.titles||[]).join("\n"))}</textarea></label>
   <fieldset class="full"><legend>Company size (staff)</legend>${SIZES.map(s=>`<label><input type="checkbox" name="size" value="${s}" ${(a.sizes||[]).includes(s)?"checked":""}> ${s.replace(" - "," to ")}</label>`).join("")}</fieldset>
   <label>Centre of the territory<input id="a_center" value="${esc(g.center)}" placeholder="Oakville, Ontario, Canada"></label>
   <label>Radius<select id="a_radius">${RADII.map(r=>`<option value="${r}" ${+g.radius===r?"selected":""}>${r} miles</option>`).join("")}</select></label>
   <label class="full">Regions and towns to include <small>one per line, used for job and funding searches</small><textarea id="a_regions" style="min-height:60px">${esc((g.regions||[]).join("\n"))}</textarea></label>
   <fieldset class="full"><legend>Buying signals that count</legend><div class="sigrows" style="width:100%">${types.map((t,i)=>`<div class="sigrow" data-si="${i}"><input type="checkbox" ${t.on!==false?"checked":""} aria-label="Use ${esc(t.type)}"><input type="text" name="type" value="${esc(t.type)}" aria-label="Signal"><input type="text" name="why" value="${esc(t.why)}" aria-label="Why it matters"><span></span></div>`).join("")}<div class="sigrow" data-si="new"><input type="checkbox" aria-label="Use custom signal"><input type="text" name="type" placeholder="Custom signal" aria-label="Custom signal"><input type="text" name="why" placeholder="Why it matters to this customer" aria-label="Why it matters"><span></span></div></div></fieldset>
   <fieldset class="full"><legend>Where Claude looks</legend>
    <label><input type="checkbox" id="a_src_news" ${src.news!==false?"checked":""}> Company news (Seamless.AI)</label>
    <label><input type="checkbox" id="a_src_jobs" ${src.jobs!==false?"checked":""}> Job postings</label>
    <label><input type="checkbox" id="a_src_funding" ${src.funding!==false?"checked":""}> Government funding and new facilities</label>
    <label><input type="checkbox" id="a_src_site" ${src.site?"checked":""}> Website gap checks</label>
    <label><input type="checkbox" id="a_src_grants" ${src.grants?"checked":""}> Federal grants and contributions</label>
    <label><input type="checkbox" id="a_src_permits" ${src.permits?"checked":""}> Building permits</label>
    <label><input type="checkbox" id="a_src_ads" ${src.ads?"checked":""}> Advertising activity</label>
    <label><input type="checkbox" id="a_src_reviews" ${src.reviews?"checked":""}> Review changes</label></fieldset>
   <label>Smallest permit worth flagging <small>estimated construction value in dollars, used when building permits are on</small><input type="number" id="a_permitMin" min="0" step="50000" value="${+src.permitMin||250000}"></label>
   <label>Permit types <small>one per line, e.g. Commercial, Industrial, Institutional, Multi-residential, Interior alterations</small><textarea id="a_permitUses" style="min-height:56px">${esc((src.permitUses||["Commercial","Industrial","Institutional"]).join("\n"))}</textarea></label>
   <label class="full">Extra searches <small>one per line, e.g. "new distribution centre Milton"</small><textarea id="a_custom" style="min-height:60px">${esc((src.custom||[]).join("\n"))}</textarea></label>
   ${cbForm(a)}
   <fieldset class="full"><legend>How the fit score is weighted</legend>
    <label>Need <input type="number" id="a_wn" min="0" max="100" value="${+w.need||0}" style="width:70px"></label>
    <label>Ability to pay <input type="number" id="a_wa" min="0" max="100" value="${+w.ability||0}" style="width:70px"></label>
    <label>Timing <input type="number" id="a_wt" min="0" max="100" value="${+w.timing||0}" style="width:70px"></label>
    <label>Market adjustment <input type="number" id="a_adj" min="-10" max="10" value="${+a.climateAdj||0}" style="width:70px"></label></fieldset>
   <label class="full">Market climate notes <small>one per line: fact | source | link. Claude reuses these in conversation starters and refreshes them monthly.</small><textarea id="a_climate">${esc((a.climate||[]).map(c=>[c.fact,c.source,c.url].filter(Boolean).join(" | ")).join("\n"))}</textarea></label>
   <label>Signals wanted per sweep<input type="number" id="a_target" min="1" max="40" value="${+a.target||8}"></label>
   <div class="ctl full"><button class="btn primary" type="submit" ${canWrite?"":"disabled"}>Save audience</button>${audDraft?`<button class="btn" type="button" id="aCancel">Cancel</button>`:""}<span class="toast" id="aT"></span></div>
  </form></section>`;
}
function cbForm(a){
  const c=a.crunchbase||{};
  return `<div class="cbsrc full"><div class="full ctl" style="justify-content:space-between"><h3>Crunchbase source</h3><span class="ctl"><button class="btn sm" type="button" id="cbFill" ${canWrite?"":"disabled"} title="Claude fills this block from the audience above and builds the saved Crunchbase search">Fill from ICP</button><label class="toast" style="flex-direction:row;display:flex;gap:6px;align-items:center;color:var(--fg)"><input type="checkbox" id="cb_on" style="width:auto" ${c.on?"checked":""}> Use Crunchbase for this audience</label></span></div>
   <p class="toast full" id="cbFT" aria-live="polite" style="margin:0">${c.filledAt?"Last filled from the ICP "+esc(dShort(c.filledAt))+". Check it, then Save audience.":"Fill from ICP drafts every field below from this audience. Nothing is saved until you press Save audience."}</p>
   <p class="lic full">${esc(LIC[ws.crunchbase?.licence||"hyperweb"])}</p>
   <fieldset class="full"><legend>Crunchbase signals that count</legend>${CB_TYPES.map(([k,l,why])=>`<label title="${esc(why)}"><input type="checkbox" name="cbt" value="${k}" ${(c.types||[]).includes(k)?"checked":""}> ${esc(l)}</label>`).join("")}</fieldset>
   <label>Regions <small>one per line</small><textarea id="cb_regions" style="min-height:56px">${esc((c.regions||[]).join("\n"))}</textarea></label>
   <label>Industries <small>one per line</small><textarea id="cb_ind" style="min-height:56px">${esc((c.industries||[]).join("\n"))}</textarea></label>
   <label>Staff size <input id="cb_size" value="${esc(c.size||"")}" placeholder="11 to 500"></label>
   <label>Look back (days)<input type="number" id="cb_look" min="7" max="365" value="${+c.lookbackDays||90}"></label>
   <label>Cadence<select id="cb_cad">${CB_CADENCE.map(x=>`<option ${x===(c.cadence||"Weekly")?"selected":""}>${x}</option>`).join("")}</select></label>
   <label>Data tokens per run <small>about 5,000 for a search with a short preview</small><input type="number" id="cb_tok" min="0" step="500" value="${+c.tokensPerRun||5000}"></label>
   <label class="full">Search in plain words <small>what the saved search looks for; Fill from ICP writes it and the runner can rebuild the search from it</small><textarea id="cb_brief" style="min-height:48px">${esc(c.searchBrief||"")}</textarea></label>
   <label class="full">Saved Crunchbase search <small>the search the runner re-runs each time</small><input id="cb_url" value="${esc(c.searchUrl||"")}" placeholder="https://www.crunchbase.com/search/..."></label>
   <label class="full">Investors to watch <small>for portfolio plays, one per line</small><textarea id="cb_inv" style="min-height:48px">${esc((c.investors||[]).join("\n"))}</textarea></label>
   <label class="full">Competitors to watch <small>one per line: name | website. The runner flags their funding and acquisitions.</small><textarea id="cb_comp" style="min-height:56px">${esc((c.competitors||[]).map(x=>[x.name,x.url].filter(Boolean).join(" | ")).join("\n"))}</textarea></label>
   <fieldset class="full"><legend>Growth outlook</legend><label><input type="checkbox" id="cb_gh" ${c.growthHighOnly!==false?"checked":""}> Only show higher-confidence growth outlooks</label><small class="muted" style="flex-basis:100%">Crunchbase gives most small private firms the same low-confidence tier, so low tiers are left out as noise. Venture-backed companies carry more data.</small></fieldset>
   ${c.template?`<p class="note full">Template: copy this setup when onboarding a workspace with this kind of buyer.</p>`:""}
  </div>`;
}
function readCB(prev){
  const types=[...document.querySelectorAll('#aForm input[name=cbt]:checked')].map(x=>x.value);
  return {...(prev||{}),on:$("cb_on").checked,types,regions:lines($("cb_regions").value),industries:lines($("cb_ind").value),size:$("cb_size").value.trim(),lookbackDays:+$("cb_look").value||90,cadence:$("cb_cad").value,
    tokensPerRun:+$("cb_tok").value||0,searchUrl:safeUrl($("cb_url").value.trim()),investors:lines($("cb_inv").value),growthHighOnly:$("cb_gh").checked,searchBrief:$("cb_brief").value.trim(),filledAt:$("cbFT").dataset.filled||prev?.filledAt||"",
    competitors:lines($("cb_comp").value).map(x=>{const [name,url]=x.split("|").map(t=>t.trim());return {name,url:url||""};})};
}
function readAud(){
  const types=[];document.querySelectorAll("#aForm .sigrow").forEach(r=>{const [cb]=r.querySelectorAll("input[type=checkbox]");const t=r.querySelector('[name=type]').value.trim(),why=r.querySelector('[name=why]').value.trim();if(t)types.push({type:t,why,on:cb.checked});});
  return {name:$("a_name").value.trim(),active:$("a_active").value==="1",headline:$("a_headline").value.trim(),who:lines($("a_who").value),notFit:lines($("a_notFit").value),industries:lines($("a_industries").value),titles:lines($("a_titles").value),
    sizes:[...document.querySelectorAll('#aForm input[name=size]:checked')].map(x=>x.value),geo:{center:$("a_center").value.trim(),radius:+$("a_radius").value,regions:lines($("a_regions").value)},
    signalTypes:types,sources:{news:$("a_src_news").checked,jobs:$("a_src_jobs").checked,funding:$("a_src_funding").checked,site:$("a_src_site").checked,grants:$("a_src_grants").checked,permits:$("a_src_permits").checked,ads:$("a_src_ads").checked,reviews:$("a_src_reviews").checked,permitMin:+$("a_permitMin").value||0,permitUses:lines($("a_permitUses").value),custom:lines($("a_custom").value)},
    weights:{need:+$("a_wn").value||0,ability:+$("a_wa").value||0,timing:+$("a_wt").value||0},climateAdj:+$("a_adj").value||0,
    climate:lines($("a_climate").value).map(x=>{const [fact,source,url]=x.split("|").map(s=>s.trim());return {fact,source:source||"",url:url||""};}),target:+$("a_target").value||8,
    crunchbase:readCB((audDraft||auds[curAud]||{}).crunchbase)};
}
function audUse(a){return {n:sigs.filter(x=>x.audienceId===a._id).length, l:Object.values(leads).filter(x=>x.audienceId===a._id).length};}
function audRmPanel(a){
  const u=audUse(a), used=u.n+u.l>0;
  return `<div class="f" id="aRmBox" style="border:1px solid var(--line);border-radius:10px;padding:12px">
   <p class="full" style="margin:0"><b>Remove ${esc(a.name)}?</b> ${used?`It has ${u.n} signal${u.n===1?"":"s"} and ${u.l} lead${u.l===1?"":"s"}. Removing it stops its sweeps and hides it from this list. Its signals and leads stay where they are, and you can restore it later.`:"Nothing on the desk uses it yet, so it will be deleted for good."}</p>
   <div class="ctl full"><button class="btn" type="button" id="aRmGo" style="border-color:var(--bad);color:var(--bad)">${used?"Remove audience":"Delete audience"}</button><button class="btn ghost" type="button" id="aRmNo">Cancel</button><span class="toast" id="aRmT"></span></div></div>`;
}
function wireAudForm(a){
  const rb=$("aRmBtn"); if(rb)rb.onclick=()=>{audRmAsk=a._id;drawAudiences();};
  const rn=$("aRmNo"); if(rn)rn.onclick=()=>{audRmAsk=null;drawAudiences();};
  const rg=$("aRmGo"); if(rg)rg.onclick=async()=>{
    rg.disabled=true; const u=audUse(a), ref=db.collection("audiences").doc(a._id);
    try{
      if(u.n+u.l>0)await ref.update({removed:true,active:false,removedAt:nowIso(),updatedAt:nowIso()});
      else await ref.delete();
      audRmAsk=null; if(audF===a._id)audF=""; if(!(u.n+u.l>0)||!showRmAud)curAud=null;
      banner(u.n+u.l>0?`${a.name} was removed. Its signals and leads are still on the desk.`:`${a.name} was deleted.`,"ok");
      drawHead();drawAudiences();
    }catch(err){rg.disabled=false;$("aRmT").textContent=saveErr(err);}
  };
  const rs=$("aRestore"); if(rs)rs.onclick=async()=>{
    rs.disabled=true;
    try{await db.collection("audiences").doc(a._id).update({removed:false,removedAt:"",updatedAt:nowIso()});banner(`${a.name} is back, paused. Set it to Active when you want it swept.`,"ok");}
    catch(err){rs.disabled=false;banner(saveErr(err),"err");}
  };
  $("aForm").onsubmit=async e=>{e.preventDefault();const v=readAud();if(!v.name){$("aT").textContent="Give the audience a name.";return;}
    const id=audDraft?slug(v.name):a._id;
    try{if(audDraft&&!auds[id])await db.collection("audiences").doc(id).set({...v,createdAt:nowIso(),updatedAt:nowIso()});else await db.collection("audiences").doc(id).update({...v,updatedAt:nowIso()});
      audDraft=null;curAud=id;$("aT").textContent="Saved";}catch(err){$("aT").textContent=saveErr(err);}};
  const c=$("aCancel"); if(c)c.onclick=()=>{audDraft=null;drawAudiences();};
  $("cbFill").onclick=()=>fillCBFromICP();
  $("aDraftBtn").onclick=()=>{$("aDraftBox").hidden=!$("aDraftBox").hidden;if(!$("aDraftBox").hidden)$("aDesc").focus();};
  $("aDraftGo").onclick=async()=>{
    const t=$("aDT"), desc=$("aDesc").value.trim(); if(!desc){t.textContent="Describe the customer first.";return;}
    const sample=await window.claude?.use?.("sample"); if(!sample){t.textContent="Claude isn't available in this view.";return;}
    t.textContent="Drafting…";
    const prompt=`Turn this description of an ideal B2B customer into a prospecting audience. Return JSON only with keys: name (short), headline (one sentence), who (3 to 5 lines), notFit (2 to 4), industries (list), titles (roles of the first person to contact), sizes (subset of ${JSON.stringify(SIZES)}), center (city, province or state, country), radius (one of 25, 50, 100, 250, in miles), regions (towns and regions to search), signalTypes (4 to 7 objects {type, why} where why says what the trigger means for THIS customer; prefer types from ${JSON.stringify(SIGNAL_LIB.map(x=>x[0]))}), custom (2 to 4 extra search phrases), weights {need, ability, timing} summing to 100.
Plain language, Canadian spelling, commas instead of dashes. Never invent statistics.
The company selling to them: ${JSON.stringify({name:ws.knowledge?.companyName||ws.name,offer:ws.knowledge?.offer,whoWeHelp:ws.knowledge?.whoWeHelp})}

/* keep every audience's Not a fit list in step with the competitor list and the Quebec rule */
async function syncGuard(rivals,qc){

    await db.collection("audiences").doc(a._id).update({notFit:next,updatedAt:nowIso()});n++;
  }

  const text=[`Subject: ${subject}`,"",intro,"",...items.map(x=>`${x.n}. ${x.line}\n   ${x.meta}`),"",lock,"",`${c.ctaText}: ${c.ctaUrl}`,"",sender,"","--",foot,opt].filter((x,i,a)=>!(x===""&&a[i-1]==="")).join("\n");
  const html=`<div style="font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.5;color:#141b26;max-width:620px">
<p>${esc(intro)}</p>
<ol style="padding-left:20px">${items.map(x=>`<li style="margin:0 0 12px"><b>${esc(x.line)}</b><br><span style="color:#5a6475;font-size:13px">${esc(x.meta)}</span></li>`).join("")}</ol>
${lock?`<p>${esc(lock)}</p>`:""}
<p><a href="${esc(c.ctaUrl)}" style="display:inline-block;background:#1d4ed8;color:#ffffff;text-decoration:none;padding:10px 16px;border-radius:6px;font-weight:bold">${esc(c.ctaText)}</a></p>
<p>${esc(sender)}</p>
<p style="color:#5a6475;font-size:12px;border-top:1px solid #d3d9e2;padding-top:10px">${esc(foot)}<br>${esc(opt)}</p></div>`;
  return {subject,text,html};
}
async function copyTeaseEmail(){
  const t=$("tCT"), e=teaseEmail();
  try{
    if(window.ClipboardItem&&navigator.clipboard?.write){await navigator.clipboard.write([new ClipboardItem({"text/plain":new Blob([e.text],{type:"text/plain"}),"text/html":new Blob([e.html],{type:"text/html"})})]);}
    else await navigator.clipboard.writeText(e.text);
    t.textContent="Copied. Paste into a Go High Level or Gmail email; the subject is the first line.";
  }catch(err){
    t.innerHTML=`Copy blocked here. Select and copy:<textarea class="mtxt" style="width:100%;min-height:160px;margin-top:6px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)" readonly>${esc(e.text)}</textarea>`;
  }
}

/* ---------- Runs ---------- */
function drawRuns(){
  const m=$("main"), rs=[...runs].sort((a,b)=>String(b.at).localeCompare(String(a.at)));
  const month=new Date().toISOString().slice(0,7), credits=rs.filter(r=>String(r.at).startsWith(month)).reduce((s,r)=>s+(+r.credits||0),0);
  const last8=rs.slice(0,8).reverse(), mx=Math.max(1,...last8.map(r=>+r.found||0));
  const fb={};sigs.filter(s=>s.status==="Dismissed"&&s.decidedBy==="Desk").forEach(s=>{fb[s.dismissReason||"Other"]=(fb[s.dismissReason||"Other"]||0)+1;});
  const acc=sigs.filter(s=>s.status==="Accepted").length, dec=sigs.filter(s=>s.decidedBy==="Desk"&&s.status!=="New").length;
  const open=reqs.filter(r=>["Queued","Running","Failed"].includes(r.status)).sort((a,b)=>String(b.requestedAt).localeCompare(String(a.requestedAt)));
  m.innerHTML=`<div class="tiles">
    <div class="tile"><span>Sweeps run</span><b>${rs.length}</b><small>${rs[0]?"Last "+esc(dShort(rs[0].at)):"None yet"}</small></div>
    <div class="tile"><span>Signals found</span><b>${sigs.length}</b><small>${sigs.filter(s=>s.triage!=="Dismiss").length} worth a look</small></div>
    <div class="tile"><span>Accept rate</span><b>${dec?Math.round(acc/dec*100)+"%":"–"}</b><small>${acc} of ${dec} decided on the desk</small></div>
    <div class="tile"><span>Credits this month</span><b>${credits}</b><small>${ws.creditBudget?"of "+ws.creditBudget+" budgeted":"No budget set"}</small></div></div>
  ${last8.length?`<section class="sect"><header><div><h2>Last ${last8.length} sweeps</h2></div><div class="legend"><span><i style="background:var(--accent)"></i>Found</span><span><i style="background:var(--signal)"></i>Worth a look</span></div></header>
   <div class="bars" role="img" aria-label="Signals found and kept per sweep">${last8.map(r=>`<div style="flex-direction:row;align-items:flex-end;gap:2px"><div><b>${+r.found||0}</b><i style="height:${(+r.found||0)/mx*70}px"></i></div><div><b>${+r.kept||0}</b><i class="k" style="height:${(+r.kept||0)/mx*70}px"></i></div></div>`).join("")}</div>
   <div class="blabs">${last8.map(r=>`<span>${esc(dShort(r.at))}</span>`).join("")}</div></section>`:""}
  ${Object.keys(fb).length?`<section class="sect"><header><div><h2>What the desk dismissed, and why</h2><p>The runner reads these before every sweep and avoids repeating them.</p></div></header><div class="strip">${Object.entries(fb).sort((a,b)=>b[1]-a[1]).map(([r,n])=>`<span class="chip">${esc(r)} <b>${n}</b></span>`).join("")}</div></section>`:""}
  ${open.length?`<section class="sect"><header><div><h2>Requests</h2></div></header><div class="tablebox"><table style="min-width:560px"><thead><tr><th>What</th><th>Status</th><th>Asked</th><th>Note</th></tr></thead><tbody>${open.map(r=>`<tr><td>${esc(r.kind)}${r.leadId?" · "+esc(leads[r.leadId]?.company||r.leadId):r.audienceId?" · "+esc(audName(r.audienceId)):""}</td><td><span class="pill ${r.status==="Failed"?"p-bad":r.status==="Running"?"p-warn":"p-info"}">${esc(r.status)}</span></td><td class="meta">${esc(dShort(r.requestedAt))}</td><td class="meta">${esc(r.note||"")}</td></tr>`).join("")}</tbody></table></div></section>`:""}
  <section class="sect"><header><div><h2>Run log</h2></div></header>${rs.length?`<div class="tablebox"><table><thead><tr><th>When</th><th>Audience</th><th class="n">Found</th><th class="n">Kept</th><th class="n">Dismissed</th><th class="n">Credits</th><th>Sources and notes</th></tr></thead><tbody>${rs.map(r=>`<tr><td class="meta">${esc(dShort(r.at))}</td><td>${esc(r.audienceId?audName(r.audienceId):"All")}</td><td class="n">${r.found??"–"}</td><td class="n">${r.kept??"–"}</td><td class="n">${r.dismissed??"–"}</td><td class="n">${r.credits??0}</td><td class="meta" style="max-width:420px">${esc((r.sources||[]).join(", "))}${(r.notes||[]).length?"<br>"+r.notes.map(esc).join("<br>"):""}</td></tr>`).join("")}</tbody></table></div>`:`<p class="muted" style="margin:0">No runs yet.</p>`}</section>`;
}

function banner(msg,kind){$("banner").innerHTML=msg?`<p class="${kind||"note"}">${esc(msg)}</p>`:"";}

/* ---------- client view: tools and internals stay behind the scenes ---------- */
let TEAM=false, asClient=false;
try{asClient=localStorage.getItem("sd-asclient")==="1";}catch(e){}
const isClientView=()=>!TEAM||asClient;
const HIDE_SEL='.cbsrc,.lic,.cbtag,.hq,[data-q="cbSweep"],.pin,.tpill,.tabs [data-tab="tease"],.tabs [data-tab="runs"]';
const HIDE_TEXT=[/^data tokens/i,/^licence$/i,/^audiences using it$/i,/crunchbase data tokens/i,/partner's crunchbase account/i,/credit budget/i,/^crunchbase licence$/i,/^credits this month$/i,/^credits$/i];
const PHRASES=[
 [/Open this desk in claude\.ai while signed in to see/g,"Sign in to see"],
 [/Write tease lines with Claude/g,"Draft tease lines"],[/Rewrite with Claude/g,"Redraft outreach"],[/Write with Claude/g,"Draft outreach"],[/Draft with Claude/g,"Draft it for me"],
 [/let Claude draft (it|them)/g,"have $1 drafted for you"],
 [/Claude isn't available in this view/g,"Drafting isn't available in this view"],[/Claude isn't allowed for this page in your view/g,"Drafting isn't turned on for you here"],
 [/Claude is busy/g,"The desk is busy"],[/Claude is reading the ICP/g,"Reading the ICP"],
 [/Where Claude looks/g,"Where we look"],[/Claude searches for new buying signals/g,"Search for new buying signals"],
 [/as Claude finds them/g,"as they're found"],[/Claude looks them up on the next runner pass/g,"We look them up shortly"],
 [/on (the|its) next (runner )?pass/g,"shortly"],[/Queued for the runner\./g,"Queued."],
 [/The runner writes one a month/g,"A new one arrives each month"],[/The runner reads these/g,"The desk reads these"],
 [/Claude, from the desk/g,"Drafted on the desk"],[/Everything Claude needs/g,"Everything the desk needs"],
 [/credentials Claude may mention/g,"credentials we may mention"],[/Claude reuses these/g,"The desk reuses these"],
 [/\s*\((Seamless\.?AI|Crunchbase)\)/gi,""],[/\s*\(spends credits\)/g,""],
 [/Crunchbase signals/g,"Funding and growth signals"],[/Aggregate statistics from Crunchbase/g,"Aggregate market statistics"],
 [/Refresh the monthly market brief from Crunchbase aggregates/g,"Refresh the monthly market brief"],
 [/Re-run the audience's saved Crunchbase search and triage new companies/g,"Look for new funding and growth signals"],
 [/Crunchbase is off for this audience\. Turn it on in Audiences\./g,"Funding and growth tracking is off for this audience."],
 [/Crunchbase: /g,"Tracking: "],[/Add them in Audiences under Crunchbase source\./g,"Ask your account manager to add them."],
 [/It never shows Crunchbase or Seamless\.AI records, company names/g,"It never shows company names"],
 [/Crunchbase/g,"market data"],[/Seamless\.?\s?AI/gi,"company data"],[/\bClaude\b/g,"the desk"],[/\b[Rr]unner\b/g,"desk"]];
const VEND=/crunchbase|seamless|\bclaude\b|\brunner\b/i;
function neutral(t){
  if(!VEND.test(t)&&!/spends credits/.test(t))return t;
  let o=t; for(const [re,to] of PHRASES)o=o.replace(re,to);
  return o.replace(/(^\s*|[.!?]\s+)(the desk|market data|company data)/g,(m,a,w)=>a+w[0].toUpperCase()+w.slice(1));
}
let cvObs=null, cvQueued=false;
function cvPass(){
  cvQueued=false;
  document.body.classList.toggle("client",isClientView());document.body.classList.toggle("team",TEAM);
  const vb=$("viewAs"), vt=asClient?"Back to team view":"See client view"; if(vb&&vb.textContent!==vt)vb.textContent=vt;
  if(!isClientView())return;
  if(cvObs)cvObs.disconnect();
  if(tab==="tease"||tab==="runs"){tab="inbox";remember();draw();}
  document.querySelectorAll(HIDE_SEL).forEach(el=>el.setAttribute("data-hx",""));
  document.querySelectorAll(".tile>span,label,legend,th").forEach(el=>{
    const own=[...el.childNodes].filter(n=>n.nodeType===3).map(n=>n.nodeValue).join("").trim();
    if(own&&HIDE_TEXT.some(re=>re.test(own))){const box=el.tagName==="SPAN"?el.parentElement:el.tagName==="LEGEND"?el.parentElement:el;box.setAttribute("data-hx","");
      if(el.tagName==="TH"){const i=[...el.parentElement.children].indexOf(el);el.closest("table")?.querySelectorAll("tr").forEach(tr=>tr.children[i]?.setAttribute("data-hx",""));}}});
  document.querySelectorAll('a[href*="crunchbase.com"],a[href*="seamless.ai"]').forEach(a=>a.replaceWith(document.createTextNode(neutral(a.textContent))));
  const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const el=n.parentElement;return !el||el.closest("script,style,[data-hx]")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT;}});
  for(let n;(n=w.nextNode());){const v=neutral(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;}
  document.querySelectorAll("[title],[aria-label],[placeholder]").forEach(el=>{if(el.closest("[data-hx]"))return;["title","aria-label","placeholder"].forEach(k=>{const v=el.getAttribute(k);if(v&&VEND.test(v))el.setAttribute(k,neutral(v));});});
  cvObs.observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:["title","aria-label","placeholder"]});
}
function cvQueue(){if(!cvQueued){cvQueued=true;queueMicrotask(cvPass);}}
cvObs=new MutationObserver(cvQueue);
cvObs.observe(document.body,{subtree:true,childList:true,characterData:true,attributes:true,attributeFilter:["title","aria-label","placeholder"]});
$("viewAs").onclick=()=>{asClient=!asClient;try{localStorage.setItem("sd-asclient",asClient?"1":"0");}catch(e){}
  document.querySelectorAll("[data-hx]").forEach(el=>el.removeAttribute("data-hx"));drawHead();draw();if(curLead&&!$("drawer").hidden)drawLead();cvQueue();};

$("meSel").onchange=e=>{const v=e.target.value;if(v==="__add"){tab="setup";remember();draw();return;}try{localStorage.setItem("sd-me",v);}catch(x){}draw();if(curLead&&!$("drawer").hidden)drawLead();};
/* ---------- boot ---------- */
drawHead();draw();
(async()=>{
  db=await window.claude?.use?.("db");
  if(!db){$("wsMeta").textContent="Not connected";banner("Open this desk in claude.ai while signed in to see its signals and leads.");return;}
  try{const u=await window.claude.use("user");const c=await u?.can?.("data.write");if(c===false)canWrite=false;TEAM=!!(await u?.canEdit?.());}catch(e){}
  if(TEAM){document.querySelectorAll("[data-hx]").forEach(el=>el.removeAttribute("data-hx"));drawHead();draw();}cvQueue();
  getMcp();
  const redraw=()=>{drawHead();if($("drawer").hidden||!curLead){if(!(tab==="audiences"&&document.activeElement&&document.activeElement.closest&&document.activeElement.closest("#aForm"))&&!(tab==="setup"&&document.activeElement?.closest?.("#sForm,#pForm"))&&!(tab==="tease"&&document.activeElement?.closest?.("#tForm,.trow")))draw();}else{drawLead();}if(!$("stage").hidden&&!document.activeElement?.closest?.("#stage a"))openClientView();};
  db.collection("workspace").onSnapshot(snap=>{const d=snap.docs.find(x=>x.id==="profile");loaded.wsExists=!!d;ws=d?d.data():{};drawHead();if(tab==="setup"?!document.activeElement?.closest?.("#sForm,#pForm"):tab==="tease"?!document.activeElement?.closest?.("#tForm,.trow"):true)draw();},()=>banner("Couldn't load the workspace. Reload the page to try again.","err"));
  db.collection("audiences").onSnapshot(snap=>{auds={};snap.docs.forEach(s=>auds[s.id]={_id:s.id,...s.data()});redraw();},()=>{});
  db.collection("moments").onSnapshot(snap=>{moments=snap.docs.map(x=>({_id:x.id,...x.data()}));redraw();},()=>{});
  db.collection("signals").onSnapshot(snap=>{sigs=snap.docs.map(s=>({_id:s.id,...s.data()}));redraw();},()=>{});
  db.collection("leads").onSnapshot(snap=>{leads={};snap.docs.forEach(s=>leads[s.id]={_id:s.id,...s.data()});if(curLead&&!$("drawer").hidden&&document.activeElement?.closest?.("#drawer textarea,#drawer input.pbnote"))return;redraw();},()=>{});
  db.collection("runs").onSnapshot(snap=>{runs=snap.docs.map(s=>({_id:s.id,...s.data()}));redraw();},()=>{});
  db.collection("requests").onSnapshot(snap=>{reqs=snap.docs.map(s=>({_id:s.id,...s.data()}));redraw();},()=>{});
})();
</script>
