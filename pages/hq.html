/* health */
function health(d){
  const h=d.health||{}, out=[];
  if(d.status==="Paused")return {k:"",label:"Paused",why:[]};
  if(!h.checkedAt)return {k:"p-warn",label:"Not checked",why:["The runner hasn't read this desk yet."]};
  const sw=daysAgo(h.lastSweepAt);
  if(sw==null)out.push("No sweep has run yet.");else if(sw>8)out.push(`Last sweep was ${sw} days ago.`);
  if(h.creditBudget&&h.creditsMonth>h.creditBudget)out.push(`Over the credit budget (${h.creditsMonth} of ${h.creditBudget}).`);
  if(h.failed)out.push(`${h.failed} failed request${h.failed===1?"":"s"} or deliveries.`);
  if(h.signalsNew>15)out.push(`${h.signalsNew} signals waiting for a decision.`);
  if(!h.audiencesActive)out.push("No active audience.");
  if(!d.ghlLocationId&&!h.ghlLocationId)out.push("No Go High Level location for delivery.");
  const bad=out.some(x=>/Over|failed|No active|No sweep/.test(x));
  return {k:out.length?(bad?"p-bad":"p-warn"):"p-good",label:out.length?(bad?"Needs attention":"Watch"):"Healthy",why:out};
}

function nextWindow(){
  const now=new Date(), et=new Date(now.toLocaleString("en-US",{timeZone:"America/Toronto"})), off=now-et;
  const at=(d,h,mi)=>{const x=new Date(d);x.setHours(h,mi,0,0);return new Date(x.getTime()+off);};
  const wd=d=>d.getDay()>0&&d.getDay()<6;
  if(wd(et)&&et.getHours()<15)return new Date(now.getTime()+2*36e5);
  const d=new Date(et);do{d.setDate(d.getDate()+1);}while(!wd(d));return at(d,10,0);}

    if(!nu.sentAt&&$("ss_ns")){nu.subject=$("ss_ns").value.trim();nu.body=$("ss_nb").value;}

  const LOCKED=["Sent","Nudged","Replied","Desk queued","Parked","Rejected"];
  const fresh=async()=>{const snap=await ref.get();return snap?.exists?(snap.data()||{}):null;};
  const twoStep=(b,label,run)=>{if(b.dataset.sure!=="1"){const was=b.textContent;b.dataset.sure="1";b.textContent=label;b.style.borderColor="var(--bad)";b.style.color="var(--bad)";
    setTimeout(()=>{if(b.isConnected&&b.dataset.sure==="1"){b.dataset.sure="";b.textContent=was;b.style.borderColor="";b.style.color="";}},6000);return;} b.dataset.sure="";run();};

      if(want&&P.filter(p=>p.reveal).length>=+ssCfg().revealCount){cb.checked=false;t.textContent=`Only ${ssCfg().revealCount} can be shown in full. Untick one first.`;return;}
      P[i]={...P[i],reveal:want};await ref.update({ss:{preview:P},updatedAt:nowIso(),updatedBy:me});}
    catch(e){cb.checked=!want;t.textContent=saveErr(e);}finally{cb.disabled=false;}});

    const act=b.dataset.ssact, {fl,nu}=edits(), s=o.ss||{};
    if(act!=="hold"&&(!fl.subject||!String(fl.body||"").trim())){t.textContent="The first look needs a subject and a message.";return;}
    const go=async()=>{
      sec.querySelectorAll("[data-ssact]").forEach(x=>x.disabled=true);
      try{const cur=await fresh(), cs=cur?.ss||{};

        else t.textContent=act==="hold"?"On hold. Nothing is sent until you approve it.":`Scheduled for ${etTime(patch.sendAt)}.`;}
      catch(e){t.textContent=saveErr(e);}
      finally{sec.querySelectorAll("[data-ssact]").forEach(x=>{if(x.isConnected)x.disabled=!canWrite;});}};
    if(act==="now")twoStep(b,`Confirm: email ${s.email||"them"} now`,go);else go();});
  const rj=$("ss_rej"), rjGo=$("ss_rejGo");

      twoStep(rjGo,polite?`Confirm: turn down and email ${s0email(o)}`:"Confirm: turn down",async()=>{rjGo.disabled=true;rj.disabled=true;
        try{const cur=await fresh(), cs=cur?.ss||{};
          if(!cur||["Rejected","Desk queued","Replied"].includes(cs.stage)){t.textContent=STALE_MSG;return;}
          const at=nowIso();

        catch(e){t.textContent=saveErr(e);}finally{if(rjGo.isConnected){rjGo.disabled=false;rj.disabled=!canWrite;}}});};}
}

function textOf(v,max){

  if(typeof md==="string")return md.slice(0,max);

}
const urlsIn=v=>{let t="";try{t=typeof v==="string"?v:JSON.stringify(v);}catch(e){}return [...new Set((t.match(/https:\/\/[^\s"'<>)\]\\]+/g)||[]).map(u=>u.replace(/[.,;]+$/,"")))];};
function mcpMsg(e,server){
  const c=e?.code;
  if(c==="server_not_connected"||c==="selection_required")return `${server} isn't connected for you. Add it in claude.ai Settings, Connectors.`;
  if(c==="needs_reauth")return `Reconnect ${server} in claude.ai Settings, Connectors.`;
  if(c==="not_in_manifest"||c==="approval_required"||c==="consent_required")return `${server} isn't allowed for this page yet.`;
  if(c==="blocked_by_policy")return `Your organization blocks ${server} here.`;
  if(c==="cancelled")return "Stopped.";
  return e?.message?String(e.message).slice(0,140):"No answer.";
}

function pendingKeys(w){return QUESTIONS.filter(([k])=>{const f=w.research?.fields?.[k];if(f?.basis==="client")return false;if(f?.basis==="inferred")return true;return !(w.answers?.[k]);}).map(([k])=>k);}

    return `${i+1}. ${q[1]}${had&&f?.basis!=="missing"?`\n   What we have: ${had}\n   Is that right? If not, what should it say?`:""}`;}).join("\n\n");
  const subject=A.subject?("Re: "+A.subject.replace(/^Re:\s*/i,"")):`A few quick questions to set up your lead desk, ${w.name}`;
  const body=A.threadId
   ? `Hi ${first},\n\nThanks for getting back to us. There are just a few left:\n\n${items}\n\nReply to this email whenever suits, short answers are perfect.\n\nThanks,`
   : `Hi ${first},\n\nThanks for setting up your lead desk with Hyperweb. We've already done our homework on ${w.name} from your website and LinkedIn, so there's only a little left to confirm.\n\nJust reply to this email with your answers. Short answers are perfect, and you can type them right under each question.\n\n${items}\n\nOnce we have these, we'll set up your first audience and start sending you opportunities.\n\nThanks,`;

const replyChecking=new Set(), replyChecked=new Set();

REPLY:

  const mt=$("m_text"); if(mt)mt.oninput=()=>{w.mDraft=mt.value;};
  const ml=$("m_label"); if(ml)ml.oninput=()=>{w.mLabel=ml.value;};
  const mAdd=$("mAdd"); if(mAdd)mAdd.onclick=async()=>{const t=(w.mDraft||"").trim(); if(!t){$("mT").textContent="Paste something first.";return;} addMaterial(w,{kind:/^(from|subject|sent):/im.test(t)?"email":"note",label:(w.mLabel||"").trim()||t.split("\n")[0].slice(0,60),text:t}); w.mDraft="";w.mLabel="";w.mMsg="Added. Click Update answers from materials when you're ready."; try{await saveWiz("Draft");}catch(e){} draw();};
  const mf=$("m_file"); if(mf)mf.onchange=async()=>{const files=[...mf.files]; if(!files.length||denied())return; const errs=[]; let n=0;
    for(const f of files){try{const r=await fileToText(f,msg=>{const el=$("mT"); if(el)el.textContent=msg;}); if(addMaterial(w,{kind:r.kind,label:f.name,text:r.text}))n++; else errs.push(f.name+": no readable content");}catch(e){errs.push(e?.code==="not_granted"?f.name+": Claude isn't allowed for this page":String(e?.message||e).slice(0,160));}}
    w.mMsg=(n?`Added ${n} file${n===1?"":"s"}. `:"")+errs.join(" "); if(n){try{await saveWiz("Draft");}catch(e){}} draw();};
  const mg=$("mGmail"); if(mg)mg.onclick=()=>{if(!denied())findGmail();};
  document.querySelectorAll("[data-gadd]").forEach(b=>b.onclick=()=>{b.disabled=true;addGmail(b.dataset.gadd);});
  document.querySelectorAll("[data-mdel]").forEach(b=>b.onclick=async()=>{w.materials=(w.materials||[]).filter(m=>m.id!==b.dataset.mdel);try{await saveWiz("Draft");}catch(e){} draw();});
  const ma=$("mApply"); if(ma)ma.onclick=()=>applyMaterials();
  document.querySelectorAll("[data-use]").forEach(b=>b.onclick=e=>{e.preventDefault();const k=b.dataset.use;w.answers[k]=w.research.fields[k].text;draw();});
  const rdA=()=>{if(w.step===1)QUESTIONS.forEach(([k])=>{w.answers[k]=$("q_"+k).value.trim();});};
  const bk=$("wBack"); if(bk)bk.onclick=()=>{if(w.researching)rCtl?.abort();if(w.step===2)readReview();else rdA();w.step--;draw();};
  const sv=$("wSave"); if(sv)sv.onclick=async()=>{if(w.step===2)readReview();else rdA();try{await saveWiz("Draft");t.textContent="Saved. Pick it up under Workspaces in onboarding.";}catch(e){t.textContent=saveErr(e);}};
  const dr=$("wDraft"); if(dr)dr.onclick=async()=>{
    if(denied())return;
    if(w.researching){t.textContent="Wait for the research to finish, or stop it.";return;}
    rdA(); const sample=await window.claude?.use?.("sample"); if(!sample){t.textContent="Claude isn't available in this view.";return;}
    dr.disabled=true;t.textContent="Drafting the audience and messaging pack…";
    const prompt=`You set up a B2B buying-signal desk for a business. From the interview, draft its first prospecting audience and its messaging pack. Return JSON only:
{"audience":{"name":"short","headline":"one sentence","who":["3 to 5"],"notFit":["2 to 4"],"industries":[],"titles":["roles of the first person to contact"],"sizes":["subset of ${SIZES.join(", ")}"],"geo":{"center":"city, province or state, country","radius":25|50|100|250,"regions":["towns and regions"]},"signalTypes":[{"type":"","why":"what this trigger means for THIS business's buyer"}],"custom":["2 to 4 search phrases"],"weights":{"need":35,"ability":40,"timing":25}},
 "knowledge":{"offer":"","whoWeHelp":"","different":"","proof":["only what the interview states"],"voice":"","avoid":[],"senderName":"","senderRole":"","bookingLink":"","mailingAddress":""},
 "ghlLocationId":"if given, else empty","gaps":["anything missing that a person must fill in, e.g. mailing address for CASL"]}
Rules: use only facts in the interview, the research notes and the client materials; the interview answers win where they conflict; companies named as ideal customers should shape the audience and its custom search phrases; never invent proof, numbers or addresses (leave a field empty and list it in gaps). Signal types should come from: Hiring marketing, Hiring sales, Expansion, Investment, New facility, Leadership change, Acquisition, Partnership, Product launch, Website gap, or a specific trigger the interview names. Plain language, Canadian spelling, commas instead of dashes.
BUSINESS: ${JSON.stringify({name:w.name,website:w.website,type:w.type})}
INTERVIEW: ${JSON.stringify(QUESTIONS.map(([k,q])=>({q,a:w.answers[k]||""})))}
RESEARCH NOTES: ${JSON.stringify(w.research?{summary:w.research.summary,shift:w.research.shift||"",people:w.research.people,unconfirmed:QUESTIONS.filter(([k])=>w.research.fields?.[k]?.basis==="inferred").map(([k])=>k)}:null)}${matBlock(w,40000)}`;
    try{const o=await sample.json(prompt,{modelTier:"default"});
      const a=o.audience||{}; w.audience={...a,sizes:(a.sizes||[]).filter(s=>SIZES.includes(s)),geo:{center:a.geo?.center||"",radius:[25,50,100,250].includes(+a.geo?.radius)?+a.geo.radius:50,regions:a.geo?.regions||[]},signalTypes:(a.signalTypes||[]).map(s=>({type:s.type,why:s.why,on:true})),sources:{news:true,jobs:true,funding:true,site:true,custom:a.custom||[]},weights:a.weights||{need:35,ability:40,timing:25},climateAdj:0,active:true,target:8};
      w.knowledge={optOut:"Not the right time? Reply 'no thanks' and I won't email again.",...(o.knowledge||{})}; w.gaps=o.gaps||[]; if(o.ghlLocationId)w.ghlLocationId=o.ghlLocationId;
      w.step=2; try{await saveWiz("Draft");}catch(e){} draw();}
    catch(e){dr.disabled=false;t.textContent=e?.code==="rate_limited"?"Claude is busy. Try again in a minute.":e?.code==="not_granted"?"Claude isn't allowed for this page in your view.":"Couldn't draft it. Try again.";}
  };
  const cr=$("wCreate"); if(cr)cr.onclick=async()=>{
    if(denied())return;
    readReview(); if(!w.audience.name||!w.audience.geo.center){t.textContent="The audience needs a name and a territory centre.";return;}
    cr.disabled=true;t.textContent="Queuing…";
    try{const id=await saveWiz("Queued");await db.collection("onboarding").doc(id).update({requestedAt:nowIso()});fireRunner(`Onboarding request from Signals HQ: create the desk for onboarding/${id} first.`);w.step=3;draw();}
    catch(e){cr.disabled=false;t.textContent=saveErr(e);}
  };
  const dn=$("wDone"); if(dn)dn.onclick=()=>{wiz=null;draw();};
}
let mcpP=null; const getMcp=()=>mcpP||(mcpP=Promise.resolve(window.claude?.use?.("mcp")).catch(()=>null));
async function fireRunner(text){const id=hq.settings?.runnerId; if(!id||!canWrite)return false; try{const mcp=await getMcp(); if(!mcp)return false; await mcp.callTool(CCR,"fire_trigger",{trigger_id:id,text},{cache:false}); return true;}catch(e){return false;}}
$("healthBtn").onclick=async()=>{if(!db||denied())return;const b=$("healthBtn");b.disabled=true;
  try{await db.collection("hq").doc("healthRequest").set({status:"Queued",requestedAt:nowIso(),requestedBy:me});const ok=await fireRunner("Health refresh requested from Signals HQ: refresh every desk's health first.");b.textContent=ok?"Refresh asked":"Queued for the next pass";}
  catch(e){banner(saveErr(e),"err");} setTimeout(()=>{b.textContent="Refresh health";b.disabled=false;},5000);};

/* ---------- learning ---------- */
function drawLearn(){
  const m=$("main"), list=Object.values(desks).filter(d=>d.health?.checkedAt);
  const agg={};list.forEach(d=>(d.health.dismissTop||[]).forEach(x=>{const r=x.reason??x[0],n=+(x.count??x[1])||0;agg[r]=(agg[r]||0)+n;}));
  const src={};list.forEach(d=>Object.entries(d.health.keptBySource||{}).forEach(([s,n])=>src[s]=(src[s]||0)+n));
  const sigT={};list.forEach(d=>Object.entries(d.health.acceptedByType||{}).forEach(([s,n])=>sigT[s]=(sigT[s]||0)+n));
  const bars=o=>{const e=Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,8),mx=Math.max(1,...e.map(x=>x[1]));return e.length?`<div class="panel" style="gap:6px">${e.map(([k,n])=>`<div class="qm" style="text-transform:none;letter-spacing:0;font-size:13px;color:var(--fg)"><span>${esc(k)}<b>${n}</b></span><i><em style="width:${n/mx*100}%"></em></i></div>`).join("")}</div>`:`<p class="muted" style="margin:0">Not enough decisions yet.</p>`;};
  m.innerHTML=`<p class="muted" style="margin:0;max-width:80ch">Every accept and dismiss on every desk feeds back into its next sweep. This is the same feedback, rolled up, so Hyperweb can tune the playbook it sells to partners.</p>
  <div class="grid">
   <section class="sect"><header><div><h2>Signals people accept</h2><p>By signal type, all desks</p></div></header>${bars(sigT)}</section>
   <section class="sect"><header><div><h2>Why signals get dismissed</h2><p>Reasons chosen on the desks</p></div></header>${bars(agg)}</section>
   <section class="sect"><header><div><h2>Sources that find keepers</h2><p>Promote and Review signals by source tool</p></div></header>${bars(src)}</section>
  </div>
  ${list.length?`<div class="tablebox"><table style="min-width:600px"><thead><tr><th>Desk</th><th class="n">Decided</th><th class="n">Accepted</th><th class="n">Accept rate</th><th>Top dismiss reason</th></tr></thead><tbody>${list.map(d=>{const h=d.health;return `<tr><td class="name">${esc(d.name)}</td><td class="n">${h.decided||0}</td><td class="n">${h.accepted||0}</td><td class="n">${h.decided?Math.round((h.accepted||0)/h.decided*100)+"%":"–"}</td><td class="meta">${esc(((h.dismissTop||[])[0]?.reason)||"–")}</td></tr>`}).join("")}</tbody></table></div>`:""}`;
}
function drawCB(){
  const m=$("main"), c=hq.crunchbase||{}, lim=+c.limit||200000, used=+c.used||0;
  const list=Object.values(desks).filter(d=>!isGone(d)).sort((a,b)=>String(a.name).localeCompare(b.name));
  const alloc=list.filter(d=>cbOf(d).licence!=="partner").reduce((t,d)=>t+(+cbOf(d).tokenBudget||0),0);
  m.innerHTML=`<section class="sect"><header><div><h2>Crunchbase across desks</h2><p>Each desk picks its own Crunchbase signal types per audience. This is where Hyperweb sets who pays for the data and how much of the shared allowance each managed desk may use.</p></div></header>
   <div class="tiles">
    <div class="tile"><span>Shared allowance</span><b>${lim.toLocaleString("en-CA")}</b><small>data tokens a month on Hyperweb's account</small></div>
    <div class="tile"><span>Used this month</span><b>${used.toLocaleString("en-CA")}</b><small>${c.checkedAt?"checked "+esc(dShort(c.checkedAt)):"not checked yet"}${c.resetsAt?", resets "+esc(dShort(c.resetsAt)):""}</small></div>
    <div class="tile"><span>Allocated to desks</span><b>${alloc.toLocaleString("en-CA")}</b><small>${alloc>lim-used?"More than is left this month":"Within what is left"}</small></div>
    <div class="tile"><span>Partner licences</span><b>${list.filter(d=>cbOf(d).licence==="partner").length}</b><small>their own accounts, no draw on ours</small></div></div>
   <p class="lic">${esc(LIC_TEXT.hyperweb)}</p>
   <p class="lic">${esc(LIC_TEXT.partner)}</p>
   ${list.length?`<div class="tablebox"><table style="min-width:720px"><thead><tr><th>Desk</th><th>Licence</th><th>Sources</th><th>Tokens a month</th><th>Used</th><th></th></tr></thead><tbody>${list.map(d=>{const x=cbOf(d), pct=x.tokenBudget?Math.min(100,Math.round((+x.tokensMonth||0)/x.tokenBudget*100)):0;return `<tr data-cb="${esc(d._id)}"><td><span class="name">${esc(d.name)}</span><span class="dom">${esc(d.type||"")}</span></td>
     <td><select class="sel" data-lic ${canWrite?"":"disabled"}><option value="hyperweb" ${(x.licence||"hyperweb")==="hyperweb"?"selected":""}>Hyperweb managed</option><option value="partner" ${x.licence==="partner"?"selected":""}>Partner's own</option></select></td>
     <td class="meta" style="max-width:280px">${(x.sources||[]).length?x.sources.map(esc).join("<br>"):"None configured"}</td>
     <td><input class="sel" type="number" min="0" step="1000" style="width:110px" data-tok value="${+x.tokenBudget||0}" ${canWrite?"":"disabled"}></td>
     <td><div class="qm" style="min-width:110px"><span>${x.tokenBudget?"of "+(+x.tokenBudget).toLocaleString("en-CA"):"No budget"}<b>${(+x.tokensMonth||0).toLocaleString("en-CA")}</b></span><i><em style="width:${pct}%;${pct>=100?"background:var(--bad)":""}"></em></i></div></td>
     <td><button class="btn sm" type="button" data-save ${canWrite?"":"disabled"}>Save</button> <span class="toast" data-t></span></td></tr>`;}).join("")}</tbody></table></div>`:""}
   <p class="muted" style="margin:0;font-size:13px">The runner copies each desk's licence and budget into the desk, stops Crunchbase runs on a managed desk once it hits its budget, and refreshes these numbers with the health check.</p></section>`;
  m.querySelectorAll("tr[data-cb]").forEach(r=>{const b=r.querySelector("[data-save]");b.onclick=async()=>{if(denied())return;const t=r.querySelector("[data-t]"),d=desks[r.dataset.cb],lic=r.querySelector("[data-lic]").value;
    try{await db.collection("desks").doc(d._id).update({crunchbase:{...cbOf(d),licence:lic,tokenBudget:lic==="partner"?0:(+r.querySelector("[data-tok]").value||0),setAt:nowIso(),setBy:me}});t.textContent="Saved";}catch(e){t.textContent=saveErr(e);}};});
}
function drawSettings(){
  const s=hq.settings||{}, r=hq.runner||{}, m=$("main");
  m.innerHTML=`<section class="sect"><header><div><h2>Runner</h2><p>One scheduled task serves every desk: hourly on weekdays from 7:20am to 7:20pm, plus on demand from any desk or from here.</p></div></header>
  <dl class="f" style="margin:0"><div class="fl">Last check-in<b style="color:var(--fg);font-weight:500">${r.lastRunAt?esc(new Date(r.lastRunAt).toLocaleString("en-CA")):"Not yet"}</b></div><div class="fl">Last result<b style="color:var(--fg);font-weight:500">${esc(r.lastResult||"–")}</b></div>
  <div class="fl">Health last refreshed<b style="color:var(--fg);font-weight:500">${r.healthAt?esc(new Date(r.healthAt).toLocaleString("en-CA")):"Not yet"}</b></div><div class="fl">Desk page version<b style="color:var(--fg);font-weight:500">${esc(s.templateVersion||"–")}</b></div></dl>
  <p class="muted" style="margin:0;font-size:13px">New desks are copies of the template desk at ${safeUrl(s.templateUrl)?`<a href="${esc(s.templateUrl)}" target="_blank" rel="noopener">the Hyperweb desk</a>`:"the Hyperweb desk"}. When the template's page changes, the runner brings every desk up to the same version, without touching their data.</p></section>`;
}

/* Crunchbase meter: read the live allowance (free call) and keep hq/crunchbase in step */
async function syncCBMeter(){
  try{
    if(!canWrite)return; const mcp=await getMcp(); if(!mcp)return;
    const r=await mcp.callTool("Crunchbase","cb_metering_get_state",{},{cache:false});
    const ms=r?.payload?.meters||[], m=ms.find(x=>x.meter_id==="data_mcp_tokens")||ms[0]; if(!m||!(+m.limit))return;
    const doc={used:+m.used||0,limit:+m.limit,available:+m.available||Math.max(0,m.limit-(m.used||0)),resetsAt:String(m.upcoming_meter_refresh||"").slice(0,10),checkedAt:nowIso(),source:"Crunchbase meter"};
    const ref=db.collection("hq").doc("crunchbase"), cur=(await ref.get())?.data?.()||{};
    if(cur.used===doc.used&&cur.limit===doc.limit&&cur.checkedAt&&Date.now()-new Date(cur.checkedAt)<10*60e3)return;
    await ref.set({...cur,...doc});
  }catch(e){}
}

/* boot */
draw();
(async()=>{
  db=await window.claude?.use?.("db");
  if(!db){banner("Open Signals HQ in claude.ai while signed in.");$("hqMeta").textContent="Not connected";return;}
  /* fail closed: any error or a "no" leaves HQ read-only; null means "not told", so writes stay on and a refused write decides */
  try{const u=await window.claude.use("user");if(u){const c=await u.can("data.write");canWrite=c!==false;try{me=await u.id();}catch(e){}}}catch(e){canWrite=false;}
  if(!canWrite)banner(READ_ONLY);
  getMcp();
  syncCBMeter();
  const busy=()=>!!document.activeElement?.closest?.(".sect textarea,.sect input,.sect select");
  db.collection("desks").onSnapshot(s=>{desks={};s.docs.forEach(d=>desks[d.id]={_id:d.id,...d.data()});if(!busy())draw();},()=>banner("Couldn't load the desks. Reload to try again.","err"));
  db.collection("onboarding").onSnapshot(s=>{onbs={};s.docs.forEach(d=>onbs[d.id]={_id:d.id,...d.data()});if(!busy())draw();},()=>{});
  db.collection("hq").onSnapshot(s=>{hq={};s.docs.forEach(d=>hq[d.id]=d.data());if(!busy())draw();},()=>{});
})();
</script>
